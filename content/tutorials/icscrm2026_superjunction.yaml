title: "ICSCRM 2026 — SiC Superjunction"
source_type: tutorial
source_pack: "Harada — Next Generation SiC Power Devices"
evidence_policy:
  tutorial_direct: "Explicitly supported by the ICSCRM 2026 tutorial"
  tutorial_derived: "Engineering synthesis derived from tutorial content"
  engineering_model: "Simplified model; not design sign-off"
  frontier: "Requires primary-source or official-source verification"
sections:
  - id: charge_balance
    title: "Charge balance"
    evidence: engineering_model
    equations:
      - "Q_N = q N_D W_N"
      - "Q_P = q N_A^- W_P"
      - "delta_Q = (Q_N - Q_P) / Q_N"
    note: "Effective ionized acceptor density should be distinguished from nominal Al concentration."
  - id: process_routes
    title: "Process routes"
    evidence: tutorial_direct
    items:
      - "Channeling implantation is advantageous from a process-cycle-time perspective."
      - "Trench filling becomes more attractive as columns become deeper."
  - id: bipolar_degradation
    title: "Double-implanted SJ-UMOS bipolar degradation"
    evidence: tutorial_direct
    tutorial_pdf_page: 137
    tutorial_slide: 30
    reference: "K. Takenaka, et al., Jpn. J. Appl. Phys. 64, 02SP43 (2025)."
    items:
      - "UMOS: ΔVf = 21.2%"
      - "SI-SJUMOS: ΔVf = 5.9%"
      - "DI-SJUMOS: maximum ΔVf = 0.48%"
      - "Tutorial states that Al and P double implantation introduces many point defects."
  - id: dynamic_incomplete_ionization
    title: "Dynamic incomplete ionization"
    evidence: tutorial_direct
    tutorial_pdf_page: 142
    tutorial_slide: 36
    items:
      - "Delayed ionization causes a temporary charge imbalance in the p-column during turn-off transients."
      - "High doping concentration degrades ionization ratio and mobility in the n-column; a lightly doped, wider asymmetric n-column is presented as preferable."
      - "Delayed ionization is associated with soft reverse recovery of the body diode."
    references:
      - "D. Nazareno, et al., IEEE Trans. Electron Devices 65, 4469 (2018)."
      - "D. Iizasa, et al., Semicond. Sci. Technol. 40, 125010 (2025)."
      - "T. Tawara, et al., Mater. Sci. Semicond. Process. 176, 108324 (2024)."
  - id: high_voltage
    title: "High-voltage direction"
    evidence: tutorial_direct
    note: "As SJ processing becomes increasingly difficult at higher voltage, SiC IGBT is highlighted as promising for the 10 kV class and above."
pending_verification:
  - "Exact quantitative cycle-time comparison across Multi-epi / trench filling / high-energy implantation / channeling implantation."
  - "Cross-vendor channel plane, corner shielding topology, Vth strategy and recommended gate-drive windows."
